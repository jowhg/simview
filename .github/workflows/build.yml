name: Build

# Every push and pull request: build SimView.app and simview-mcp, keep them as a workflow artifact.
# Tags v*: also publish a GitHub release with SimView-<version>.zip (the app, simview-mcp inside it)
# and print the Homebrew cask lines to update.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Select the newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./build.sh

      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir dist
          ditto -c -k --keepParent build/SimView.app "dist/SimView-$VERSION.zip"
          (cd dist && shasum -a 256 *.zip > SHA256SUMS)
          cat dist/SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: SimView-${{ steps.version.outputs.version }}
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: SimView-${{ needs.build.outputs.version }}
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "SimView $VERSION" --generate-notes

      - name: Homebrew cask lines
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          sha=$(awk '{print $1}' dist/SHA256SUMS)
          {
            echo "### Homebrew cask"
            echo "Update \`Casks/simview.rb\` in the tap with:"
            echo '```ruby'
            echo "  version \"$VERSION\""
            echo "  sha256 \"$sha\""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
