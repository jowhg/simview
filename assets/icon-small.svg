<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- SimView app icon, simplified for 16 and 32 px: same layout, heavier frames, one screen detail. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A3A3F"/>
      <stop offset="1" stop-color="#0C0C0E"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <rect id="frameShape" x="-150" y="-290" width="300" height="580" rx="76"/>
    <rect id="screenShape" x="-108" y="-248" width="216" height="496" rx="40"/>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <g transform="rotate(-15 512 1120) translate(512 520)">
    <use href="#frameShape" fill="#8E8E95"/>
    <use href="#screenShape" fill="#1E1E22"/>
  </g>
  <g transform="rotate(15 512 1120) translate(512 520)">
    <use href="#frameShape" fill="#8E8E95"/>
    <use href="#screenShape" fill="#1E1E22"/>
  </g>
  <g transform="translate(512 512)">
    <rect x="-170" y="-310" width="340" height="620" rx="96" fill="#141417"/>
    <use href="#frameShape" fill="#FFFFFF"/>
    <use href="#screenShape" fill="#0C0C0E"/>
    <rect x="-72" y="-196" width="144" height="140" rx="28" fill="#D8D8DE"/>
    <rect x="-72" y="-4" width="144" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.75"/>
  </g>
</svg>
