<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- SimView app icon. Monochrome: one live simulator in front, two fanned behind it. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A3A3F"/><stop offset="1" stop-color="#0C0C0E"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="430" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.07"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/><stop offset="0.3" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D4D4DA"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#202024"/><stop offset="1" stop-color="#0A0A0C"/></linearGradient>
    <linearGradient id="bframe" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8C8C93"/><stop offset="1" stop-color="#5E5E65"/></linearGradient>
    <linearGradient id="bscreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A2A2F"/><stop offset="1" stop-color="#16161A"/></linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E9E9EE"/><stop offset="1" stop-color="#9A9AA2"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="devShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <rect id="frameShape" x="-130" y="-260" width="260" height="520" rx="62"/>
    <rect id="screenShape" x="-112" y="-242" width="224" height="484" rx="46"/>
    <g id="ghostUI" fill="#FFFFFF" fill-opacity="0.1">
      <rect x="-86" y="-196" width="172" height="132" rx="24"/>
      <rect x="-86" y="-34" width="172" height="24" rx="12"/>
      <rect x="-86" y="10" width="118" height="24" rx="12"/>
      <rect x="-86" y="70" width="78" height="78" rx="22"/>
      <rect x="8" y="70" width="78" height="78" rx="22"/>
    </g>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
  <g transform="rotate(-14 512 1100) translate(512 530)" filter="url(#devShadow)">
    <use href="#frameShape" fill="url(#bframe)"/><use href="#screenShape" fill="url(#bscreen)"/><use href="#ghostUI"/>
  </g>
  <g transform="rotate(14 512 1100) translate(512 530)" filter="url(#devShadow)">
    <use href="#frameShape" fill="url(#bframe)"/><use href="#screenShape" fill="url(#bscreen)"/><use href="#ghostUI"/>
  </g>
  <g transform="translate(512 512) scale(1.08)" filter="url(#devShadow)">
    <use href="#frameShape" fill="url(#frame)"/><use href="#screenShape" fill="url(#screen)"/>
    <circle cx="-70" cy="-204" r="11" fill="#FFFFFF"/>
    <rect x="-42" y="-214" width="68" height="20" rx="10" fill="#FFFFFF" fill-opacity="0.35"/>
    <rect x="-86" y="-164" width="172" height="124" rx="24" fill="url(#hero)"/>
    <rect x="-86" y="-12" width="172" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.75"/>
    <rect x="-86" y="30" width="118" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.35"/>
    <rect x="-86" y="86" width="78" height="78" rx="22" fill="#FFFFFF" fill-opacity="0.24"/>
    <rect x="8" y="86" width="78" height="78" rx="22" fill="#FFFFFF" fill-opacity="0.24"/>
  </g>
</svg>
